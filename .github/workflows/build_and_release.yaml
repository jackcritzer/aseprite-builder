
name: Build and release Aseprite (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
          group: aseprite
          repo: aseprite
          match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (Windows)
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 \
            https://github.com/aseprite/aseprite \
            --branch ${{ needs.create-release.outputs.release-tag }}

      - name: Install Skia
        working-directory: aseprite
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" `
            -OutFile "skia.zip"
          Expand-Archive -Path "skia.zip" -DestinationPath "skia"

      - uses: aseprite/get-ninja@main

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(pwd)/skia" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR="$(pwd)/skia/out/Release-x64"

      - name: Compile
        shell: bash
        working-directory: aseprite
        run: |
          cmake --build build

      - name: Clean up build folder
        working-directory: aseprite/build/bin
        shell: pwsh
        run: |
          Get-ChildItem | Where-Object {
            $_.Name -notin @('aseprite.exe', 'data')
          } | Remove-Item -Recurse -Force

      - name: Make portable
        working-directory: aseprite/build/bin
        shell: pwsh
        run: |
          Set-Content -Path "aseprite.ini" `
            -Value "# This file is here so Aseprite behaves as a portable program"

      - name: Create release ZIP
        working-directory: aseprite/build/bin
        shell: pwsh
        run: |
          7z a -tzip `
            "Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip" `
            "aseprite.exe" "data" "aseprite.ini"

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip
          tag: ${{ needs.create-release.outputs.release-tag }}
